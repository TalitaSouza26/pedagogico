<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Pedagógico — Início (2)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; display: flex; height: 100vh; overflow: hidden; font-size: 13px; color: #333; }
    /* modo "bare": usado quando a ficha é embutida (iframe) em outra tela — mostra só o bottom-sheet */
    html.bare, body.bare { background: transparent !important; }
    body.bare .main { background: transparent !important; }
    body.bare .sidebar, body.bare .topbar, body.bare .view-wrap { display: none !important; }
    /* o dim vem da tela-pai (iframe transparente); evita escurecimento duplo */
    body.bare .sheet-overlay { background: transparent !important; }
    .sidebar { display: flex; flex-direction: column; }
    .sidebar-logo { display: flex; align-items: center; gap: 8px; }
    .logo-img { width: 104px; height: auto; display: block; }
    .nav { flex: 1 1 auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background .15s; text-decoration: none; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .logout { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logout svg { width: 16px; height: 16px; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; }
    .user-info { text-align: right; }
    .view-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--branco); position: relative; }
    .view-wrap > .content { padding: 0; height: 100%; }

    .muni-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .muni-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--texto); }
    .muni-sub { font-size: 12.5px; color: var(--texto-suave); }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 34px; }
    @media (max-width: 900px){ .kpi-grid { grid-template-columns: 1fr; } }
    .kcard { background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .kcard-l { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .kic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kic svg { width: 21px; height: 21px; }
    .klbl { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--texto); }
    .ksub { font-size: 11.5px; color: var(--texto-suave); margin-top: 2px; }
    .kval { font-family: var(--font-display); font-weight: 800; font-size: 25px; color: var(--laranja-escuro); white-space: nowrap; }
    .ic-azul{background:var(--azul-claro);color:var(--azul);} .ic-roxo{background:#EFEAF7;color:#6B3FA0;} .ic-verde{background:var(--verde-bg);color:#2E8B00;} .ic-laranja{background:var(--laranja-bg);color:var(--laranja-escuro);} .ic-ambar{background:#FDF3D9;color:var(--ambar-escuro);}
    .vagas-panel { background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio); padding: 20px 22px; margin-bottom: 26px; }
    .vp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .vp-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--texto); }
    .vp-hint { font-size: 12px; color: var(--texto-suave); }
    .vp-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
    @media (max-width: 620px){ .vp-blocks { grid-template-columns: 1fr; } }
    .vp-block { background: var(--bg); border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 14px 16px; }
    .vp-lbl { font-size: 12px; color: var(--texto-suave); }
    .vp-num { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--azul); margin: 4px 0 2px; }
    .vp-num.verde{color:#2E8B00;} .vp-num.laranja{color:var(--laranja-escuro);}
    .vp-sub { font-size: 11px; color: var(--texto-suave); }
    .occ2-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--texto-suave); margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
    .occ2-top b { color: var(--texto); }
    .occ2-track { height: 10px; border-radius: 5px; background: #EAECF0; overflow: hidden; }
    .occ2-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--laranja), var(--azul)); }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--verde); margin-right: 5px; }

    /* consulta no topo + bubo grandão no centro com cards ao redor */
    .topsearch { text-align: center; max-width: 640px; margin: 0 auto; padding: 4px 0 10px; }
    .ask-eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul); opacity: .85; }
    .ask-q { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--texto); margin: 6px 0 16px; line-height: 1.2; }
    .ask-search { position: relative; max-width: 560px; margin: 0 auto; }
    .hero { display: flex; justify-content: center; margin-top: 6px; }
    .hero-inner { position: relative; width: 100%; max-width: 1200px; min-height: 610px; }
    .hero-bubo { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); height: 492px; width: auto; pointer-events: none; z-index: 1; filter: drop-shadow(0 20px 26px rgba(18,80,154,.20)); }
    .hero-card { position: absolute; width: 288px; height: 90px; background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio); padding: 0 16px; box-shadow: 0 10px 26px rgba(15,23,32,.10); display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 2; }
    .hero-card .kic { width: 40px; height: 40px; }
    .hero-card .kcard-l { flex: 1; min-width: 0; }
    .hero-card .klbl { line-height: 1.2; }
    .hero-card .ksub { line-height: 1.25; }
    .hero-card .kval { font-size: 22px; }
    .h1 { top: 0; left: 0; }   .h2 { top: 0; right: 0; }
    .h3 { top: 16%; left: 0; } .h4 { top: 16%; right: 0; }
    .h5 { top: 32%; left: 0; } .h6 { top: 32%; right: 0; }
    .h7 { top: 48%; left: 0; } .h8 { top: 48%; right: 0; }
    .h9 { top: 64%; left: 0; } .h10 { top: 64%; right: 0; }
    .h11 { top: 80%; left: 0; } .h12 { top: 80%; right: 0; }
    @media (max-width: 1180px){ .hero-inner { display: flex; flex-direction: column; gap: 12px; min-height: 0; } .hero-bubo { position: static; transform: none; height: 210px; margin: 4px auto 10px; order: -1; } .hero-card { position: static; width: 100%; } }
    .search-box { display: flex; align-items: center; gap: 12px; background: var(--branco); border: 2px solid var(--borda); border-radius: 30px; padding: 14px 20px; box-shadow: 0 10px 26px rgba(18,80,154,.10); transition: border-color .15s, box-shadow .15s; }
    .search-box:focus-within { border-color: var(--azul); box-shadow: 0 10px 30px rgba(18,80,154,.18); }
    .search-box svg { width: 20px; height: 20px; color: var(--laranja); flex-shrink: 0; }
    .search-box input { border: none; outline: none; background: none; font-family: var(--font-display); font-size: 15px; width: 100%; color: var(--texto); }
    .results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; box-shadow: 0 18px 40px rgba(15,23,32,.16); overflow: hidden; z-index: 20; max-height: 320px; overflow-y: auto; }
    .results[hidden] { display: none; }
    .res-item { display: flex; align-items: center; gap: 11px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--bg); }
    .res-item:last-child { border-bottom: none; }
    .res-item:hover, .res-item.active { background: var(--azul-claro); }
    .res-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--laranja-bg); color: var(--laranja-escuro); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .res-ic svg { width: 15px; height: 15px; }
    .res-nome { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--texto); }
    .res-sub { font-size: 11.5px; color: var(--texto-suave); }
    .res-empty { padding: 16px; text-align: center; color: var(--texto-suave); font-size: 13px; }
    .ask-hint { font-size: 12px; color: var(--texto-suave); margin-top: 10px; }

    /* ---- palco do quadro (sala de aula) ---- */
    .board-stage { position: relative; flex: 1 1 0; min-width: 0; height: 100%; margin: 0; overflow: hidden; }
    /* frame com a proporção da imagem (3:2), dimensionado p/ cobrir a área toda — sem sobra */
    .board-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: max(100%, calc((100vh - 90px) * 1.333)); aspect-ratio: 4 / 3; }
    .board-bg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .board-bg-write { opacity: 0; transition: opacity .4s ease; }         /* bubo escrevendo (aparece ao digitar) */
    .board-frame.writing .board-bg-write { opacity: 1; }
    .board-area { position: absolute; top: 21%; left: 34.7%; right: 17.3%; bottom: 46%; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: clamp(12px, 2.4vh, 24px); }
    .board-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(17px, 2vw, 27px); color: #fff; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.4); margin-bottom: 2px; }
    /* título azul ACIMA do quadro (na parede) */
    .board-heading { position: absolute; top: 11%; left: 28%; right: 9%; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(18px, 2.1vw, 30px); color: var(--azul); text-shadow: 0 1px 2px rgba(255,255,255,.55); }
    .board-search { background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.55); box-shadow: 0 6px 18px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); padding: 10px 16px; }
    .board-search svg { color: #fff; }
    .board-search input { color: #fff; font-size: clamp(13px,1.3vw,15px); }
    .board-search input::placeholder { color: rgba(255,255,255,.82); }
    .board-search:focus-within { border-color: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
    /* o próprio quadro é o campo de texto (escrever a "giz") */
    .board-area { cursor: text; }
    .board-write { width: 100%; background: transparent; border: none; outline: none; text-align: center; font-family: var(--font-display); font-weight: 800; color: #fff; caret-color: #fff; font-size: clamp(20px, 2.6vw, 34px); text-shadow: 0 1px 10px rgba(0,0,0,.45); padding: 4px; }
    .board-write::placeholder { color: rgba(255,255,255,.72); font-weight: 600; font-size: clamp(13px, 1.5vw, 18px); }
    /* nomes de escolas aparecendo/sumindo — bem calmo, sem efeito giz */
    .board-ticker { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); align-items: start; justify-items: center; gap: clamp(12px, 2vh, 22px) clamp(14px, 2.2vw, 34px); text-align: center; overflow: hidden; }
    .board-ticker .tk-item { min-width: 0; opacity: 0; transition: opacity 1.4s ease; border-radius: 10px; padding: 5px 8px; }
    .board-ticker .tk-item.show { opacity: 1; }
    .board-ticker .tk-pick { cursor: pointer; transition: opacity 1.4s ease, background .15s; }
    .board-ticker .tk-pick:hover { background: rgba(255,255,255,.16); }
    .board-ticker .tk-nome { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 1.5vw, 20px); color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.45); line-height: 1.2; }
    .board-ticker .tk-sub { font-size: clamp(11px,1vw,13px); color: rgba(255,255,255,.8); margin-top: 2px; }
    /* resultados da busca — caixa branca com rolagem interna (aparece abaixo do campo) */
    .board-input-wrap { position: relative; }
    .board-results { position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: min(620px, 78vw); background: #fff; border: 1px solid var(--borda); border-radius: 14px; box-shadow: 0 20px 48px rgba(0,0,0,.3); max-height: 44vh; overflow-y: auto; z-index: 30; text-align: left; }
    .board-results[hidden] { display: none; }
    .board-results .res-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--bg); }
    .board-results .res-item:last-child { border-bottom: none; }
    .board-results .res-item:hover, .board-results .res-item.active { background: var(--azul-claro); }
    .board-results .res-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--laranja-bg); color: var(--laranja); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .board-results .res-nome { color: var(--texto); font-weight: 700; line-height: 1.2; }
    .board-results .res-sub { color: var(--texto-suave); font-size: 13px; margin-top: 1px; }
    .board-results .res-empty { padding: 14px 16px; color: var(--texto-suave); }
    /* layout: painel de índices à esquerda + quadro à direita */
    .inicio-layout { display: flex; height: 100%; }
    .kpi-panel { flex-shrink: 0; width: clamp(240px, 23vw, 322px); background: #f5f8fc; border-right: 1px solid var(--borda); padding: 22px 18px; overflow-y: auto; }
    .kpi-panel-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(17px, 1.5vw, 21px); color: var(--azul-escuro); }
    .kpi-panel-sub { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
    .kpi-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
    .kpi-card { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 13px 15px; box-shadow: 0 4px 14px rgba(15,23,32,.05); }
    .kpi-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kpi-ic.azul { background: var(--azul-claro); color: var(--azul); }
    .kpi-ic.laranja { background: var(--laranja-bg); color: var(--laranja); }
    .kpi-ic.verde { background: var(--verde-bg); color: var(--verde); }
    .kpi-card .kv { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 1.8vw, 25px); color: var(--texto); line-height: 1; }
    .kpi-card .kl { font-size: 13px; color: var(--texto-suave); margin-top: 3px; }

    @media (max-width: 860px){
      .view-wrap > .content { height: auto; }
      .inicio-layout { flex-direction: column; height: auto; }
      .kpi-panel { width: auto; border-right: none; border-bottom: 1px solid var(--borda); }
      .kpi-cards { flex-direction: row; flex-wrap: wrap; }
      .kpi-card { flex: 1 1 140px; }
      .board-stage { height: auto; }
      .board-frame { position: static; transform: none; width: 100%; aspect-ratio: auto; }
      .board-bg { position: static; height: 160px; object-fit: cover; object-position: 30% 38%; }
      .board-bg-write { display: none; }
      .board-area { position: static; inset: auto; background: #23453a; margin: 0; padding: 16px; gap: 10px; min-height: 240px; }
    }

    /* bottom sheet com dados da escola */
    .sheet-overlay { position: absolute; inset: 0; background: rgba(15,23,32,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 90%; background: var(--branco); border-radius: 22px 22px 0 0; box-shadow: 0 -14px 50px rgba(15,23,32,.22); transform: translateY(102%); transition: transform .34s cubic-bezier(.2,.75,.3,1); z-index: 31; display: flex; flex-direction: column; }
    .sheet.open { transform: translateY(0); }
    .sheet-grab { width: 44px; height: 5px; border-radius: 3px; background: #D7DEE8; margin: 10px auto 0; flex-shrink: 0; }
    .sheet-head { display: flex; align-items: center; gap: 14px; padding: 14px 28px 16px; border-bottom: 1px solid var(--borda); }
    .sheet-ic { width: 48px; height: 48px; border-radius: 13px; background: var(--azul-claro); color: var(--azul); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sheet-ic.cmei { background: var(--laranja-bg); color: var(--laranja-escuro); }
    .sheet-ic svg { width: 24px; height: 24px; }
    .sheet-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--texto); }
    .sheet-subt { font-size: 12.5px; color: var(--texto-suave); margin-top: 2px; }
    .vg-embed { margin-top: 10px; border-top: 1px solid var(--borda); padding-top: 18px; }
    .vg-embed-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .vg-embed iframe { width: 100%; border: 0; display: block; min-height: 400px; }
    .bim-sel { margin-left: auto; border: 1px solid var(--borda); background: var(--branco); border-radius: 10px; padding: 8px 12px; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--texto); cursor: pointer; outline: none; }
    .bim-sel:hover { border-color: var(--azul); }
    .sheet-close { border: 1px solid var(--borda); background: var(--branco); border-radius: 10px; cursor: pointer; color: var(--texto-suave); padding: 9px; display: flex; }
    .sheet-close:hover { border-color: var(--azul); color: var(--azul); }
    .sheet-close svg { width: 18px; height: 18px; }
    .sheet-tabs { display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid var(--borda); overflow-x: auto; flex-shrink: 0; }
    .sheet-tab { padding: 13px 16px; border: none; background: none; border-bottom: 3px solid transparent; margin-bottom: -1px; font-family: var(--font-display); font-size: 13.5px; font-weight: 500; color: var(--texto-suave); cursor: pointer; white-space: nowrap; }
    .sheet-tab:hover { color: var(--texto); }
    .sheet-tab.active { color: var(--laranja); border-bottom-color: var(--laranja); font-weight: 700; }
    .stabpane[hidden] { display: none; }
    .sheet-body { padding: 22px 28px 30px; overflow-y: auto; flex: 1; }
    .eq-note { font-size: 12px; color: var(--texto-suave); background: var(--azul-claro); border: 1px solid #C8DCF3; border-radius: var(--raio-sm); padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start; }
    .eq-note svg { width: 15px; height: 15px; color: var(--azul); flex-shrink: 0; margin-top: 1px; }
    .dist-row { display: grid; grid-template-columns: 130px 1fr 54px; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .dist-track { height: 9px; border-radius: 5px; background: #EEF1F5; overflow: hidden; }
    .dist-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--laranja), var(--azul)); }
    .dist-n { text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--texto); }
    .al-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .al-count { font-size: 13px; color: var(--texto-suave); }
    .al-count b { font-family: var(--font-display); font-weight: 800; color: var(--texto); }
    .al-search { display: inline-flex; align-items: center; gap: 8px; background: var(--branco); border: 1px solid var(--borda); border-radius: 10px; padding: 7px 12px; min-width: 240px; }
    .al-search:focus-within { border-color: var(--azul); }
    .al-search svg { width: 15px; height: 15px; color: var(--texto-suave); }
    .al-search input { border: none; outline: none; font-family: var(--font-display); font-size: 13px; width: 100%; background: none; color: var(--texto); }
    .al-ee-chk { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: #6B3FA0; background: #EFEAF7; border: 1px solid #DFD3EF; border-radius: 10px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
    .al-ee-chk input { accent-color: #6B3FA0; cursor: pointer; }
    /* Filtros da aba Alunos (mesmo padrão da tela Alunos) */
    .fflt-toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--azul); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-family: var(--font-display); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .fflt-toggle:hover { background: var(--azul-escuro); }
    .fflt-toggle.on { background: var(--azul-escuro); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
    .fflt-toggle svg { width: 15px; height: 15px; }
    .fflt-count { background: #fff; color: var(--azul); border-radius: 20px; font-size: 11px; font-weight: 800; padding: 1px 7px; }
    .fflt-count[hidden] { display: none; }
    .fflt-redef { border: 1px solid var(--borda); background: var(--branco); border-radius: 10px; padding: 8px 12px; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--azul); cursor: pointer; }
    .fflt-redef:hover { border-color: var(--azul); background: var(--azul-claro); }

let selIdx = -1, matches = [];
function buscar(){
  const q = document.getElementById('busca').value.trim().toLowerCase();
  const box = document.getElementById('results');
  const tk = document.getElementById('boardTicker'); if(tk) tk.style.visibility = q ? 'hidden' : '';
  const fr = document.getElementById('boardFrame'); if(fr) fr.classList.toggle('writing', !!q);  // bubo vira p/ escrever
  if(!q){ box.hidden = true; matches = []; selIdx = -1; return; }
  matches = ESCOLAS.filter(e=> e.nome.toLowerCase().includes(q) || e.bairro.toLowerCase().includes(q));
  selIdx = -1;
  if(!matches.length){ box.innerHTML = `<div class="res-empty">Nenhuma escola encontrada.</div>`; box.hidden = false; return; }
  box.innerHTML = matches.map((e,i)=>`
    <div class="res-item" data-i="${i}" onmousedown="event.preventDefault();abrirFicha('${e.inep}')">
      <span class="res-ic">${svgP(ICON_ESC,16)}</span>
      <div><div class="res-nome">${e.nome}</div><div class="res-sub">${e.bairro} · ${e.matriculas} alunos</div></div>
    </div>`).join('');
  box.hidden = false; box.scrollTop = 0;
}
function navResultados(ev){
  const box = document.getElementById('results');
  if(box.hidden || !matches.length){ if(ev.key==='Enter' && matches[0]) abrirFicha(matches[0].inep); return; }
  if(ev.key==='ArrowDown'){ ev.preventDefault(); selIdx = Math.min(selIdx+1, matches.length-1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); selIdx = Math.max(selIdx-1, 0); }
  else if(ev.key==='Enter'){ ev.preventDefault(); const e = matches[selIdx>=0?selIdx:0]; if(e) abrirFicha(e.inep); return; }
  else if(ev.key==='Escape'){ box.hidden = true; return; }
  box.querySelectorAll('.res-item').forEach((el,i)=> el.classList.toggle('active', i===selIdx));
  box.querySelector('.res-item.active')?.scrollIntoView({block:'nearest'});
}

/* ---- vitrine de escolas no quadro (várias de uma vez, calma; pausa ao digitar) ---- */
(function(){
  const tk = document.getElementById('boardTicker');
  if(!tk || !ESCOLAS.length) return;
  const fila = ESCOLAS.slice();                       // embaralha UMA vez (fila justa, sem repetir)
  for(let i=fila.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fila[i],fila[j]]=[fila[j],fila[i]]; }
  let p = 0;
  const next = () => fila[(p++) % fila.length];
  const render = el => { const e = next(); el._inep = e.inep; el.innerHTML = `<div class="tk-nome">${e.nome}</div><div class="tk-sub">${e.bairro}</div>`; };
  const pausado = () => tk.style.visibility === 'hidden';
  const N = 3;                                         // quantas escolas aparecem ao mesmo tempo (mostruário)
  const slots = [];
  for(let k=0;k<N;k++){ const el=document.createElement('div'); el.className='tk-item tk-pick'; el.addEventListener('mousedown', ev=>{ ev.preventDefault(); if(el._inep) abrirFicha(el._inep); }); tk.appendChild(el); render(el); el.classList.add('show'); slots.push(el); }
  let hovering = false;                                // pausa a troca enquanto o mouse está sobre o mostruário
  tk.addEventListener('mouseenter', ()=> hovering = true);
  tk.addEventListener('mouseleave', ()=> hovering = false);
  slots.forEach((el,k)=>{                              // cada uma troca sozinha, escalonada → movimento suave
    setTimeout(()=> setInterval(()=>{
      if(pausado() || hovering) return;
      el.classList.remove('show');
      setTimeout(()=>{ if(!pausado() && !hovering){ render(el); el.classList.add('show'); } }, 1400);
    }, 6000), k*1200);
  });
})();

/* ---- folha com dados da escola (em abas) ---- */
const NOMES_AL = ['Lucas','Mariana','Pedro','Beatriz','Gabriel','Letícia','Rafael','Júlia','Enzo','Sofia','Matheus','Helena','Davi','Valentina','Miguel','Laura','Arthur','Alice','Théo','Cecília','Heitor','Isabela','Gustavo','Lorena'];
const SOBR_AL = ['Silva','Souza','Oliveira','Santos','Rocha','Fontes','Melo','Prado','Nunes','Alves','Farias','Menezes','Ribeiro','Gomes'];
const TIPOS_OC = ['Conflito entre estudantes','Desrespeito ao professor','Uso indevido de celular','Saída sem autorização','Infrequência'];
function turmasDaEscola(e){
  const turnos = e.cmei ? ['Integral'] : ['Matutino','Vespertino'];
  const base = parseInt(e.inep.slice(-3)); const rr = k=>((base*9301+k*49297)%233280)/233280;
  const cr = /Creche|Pré/.test(e.etapas);
  const pool = cr ? ['CN I','CN II','Pré I','Pré II']
    : (/Anos finais/.test(e.etapas) ? ['1º ano','2º ano','3º ano','4º ano','5º ano','6º ano','7º ano','8º ano','9º ano']
    : ['1º ano','2º ano','3º ano','4º ano','5º ano']);
  const combos = /Anos finais/.test(e.etapas) ? ['1º/2º ano','3º/4º/5º ano','6º/7º ano','8º/9º ano'] : ['1º/2º ano','3º/4º ano','4º/5º ano'];
  const out = []; const n = Math.min(e.turmas, 12);
  for(let i=0;i<n;i++){
    // escolas multisseriadas têm turmas seriadas E algumas multisseriadas (~1/3)
    if(e.multisseriada && i % 3 === 2){
      out.push({ nome: combos[i % combos.length], turno: turnos[i%turnos.length], alunos: 12+Math.floor(rr(i+3)*12), multi:true });
    } else {
      out.push({ nome: pool[i%pool.length]+' '+String.fromCharCode(65+Math.floor(i/pool.length)), turno: turnos[i%turnos.length], alunos: 16+Math.floor(rr(i+3)*16) });
    }
  }
  return out;
}
function ocorrenciasDaEscola(e){
  const base = parseInt(e.inep.slice(-3)); const rr = k=>((base*9301+k*49297)%233280)/233280;
  const turmas = turmasDaEscola(e);
  return Array.from({length: e.ocorrencias},(_,i)=>({
    al: NOMES_AL[Math.floor(rr(i*4+1)*NOMES_AL.length)]+' '+SOBR_AL[Math.floor(rr(i*4+2)*SOBR_AL.length)],
    t: turmas.length ? turmas[Math.floor(rr(i*4+3)*turmas.length)].nome : '—',
    tipo: TIPOS_OC[Math.floor(rr(i*4+4)*TIPOS_OC.length)],
    data: String(1+Math.floor(rr(i*4+5)*25)).padStart(2,'0')+'/08/2026',
  }));
}
function serieDaTurma(t){ return t.replace(/\s+[A-Z]$/,''); }
function nivelDaSerie(s){
  if(/Creche|CN|Pré|Berçário/.test(s)) return 'Educação Infantil';
  if(/EJA/.test(s)) return 'EJA';
  const n = parseInt(s); if(isNaN(n)) return 'Anos iniciais';
  return n <= 5 ? 'Anos iniciais' : 'Anos finais';
}
function alunosDaEscola(e){
  const turmas = turmasDaEscola(e); const out = []; let idx = 0;
  turmas.forEach(t=>{ for(let i=0;i<t.alunos;i++){
    const h = seedFrom(e.inep+'a'+idx);
    const nome = NOMES_AL[h % NOMES_AL.length] + ' ' + SOBR_AL[Math.floor(h/97) % SOBR_AL.length];
    const tea = (seedFrom(e.inep+'t'+idx) % 40) === 0;
    const serie = serieDaTurma(t.nome);
    const nivel = nivelDaSerie(serie);
    const semCpf = (h % 17 === 0), semResp = (h % 23 === 0), semTurma = (h % 29 === 0);
    const doc = (semCpf || semResp || h % 13 === 0) ? 'Incompleta' : 'Completa';
    const m = h % 40; const status = m === 0 ? 'Transferido' : m === 1 ? 'Evadido' : m === 2 ? 'Remanejado' : 'Ativo';
    out.push({ nome, turma: t.nome, turno: t.turno, tea, serie, nivel, cpf: !semCpf, resp: !semResp, enturmado: !semTurma, doc, status }); idx++;
  }});
  return out.sort((a,b)=> a.nome.localeCompare(b.nome) || a.turma.localeCompare(b.turma));
}

const FFLT_MAP = { fnivel:'nivel', fserie:'serie', fturno:'turno', fdoc:'doc', fstatus:'status', fentur:'entur', fcpf:'cpf', fresp:'resp', fee:'ee' };

    <div class="fields">
      <div class="fld"><div class="fl">Etapas atendidas</div><div class="fv">${e.etapas}</div></div>
      <div class="fld"><div class="fl">Modalidade</div><div class="fv">${e.modalidade}</div></div>
      <div class="fld"><div class="fl">Organização das turmas</div><div class="fv">${e.multisseriada ? 'Seriada e multisseriada' : 'Seriada (regular)'}</div></div>
      <div class="fld"><div class="fl">Salas (no prédio)</div><div class="fv">${e.salas != null ? e.salas : '—'}</div></div>
      <div class="fld"><div class="fl">Anexos</div><div class="fv">${e.anexos ? e.anexos : 'Nenhum'}</div></div>
      <div class="fld"><div class="fl">Turnos</div><div class="fv">${turnosEsc}</div></div>
      <div class="fld"><div class="fl">Localidade</div><div class="fv">${e.localidade} · ${e.bairro}</div></div>
    </div>`;

  /* aba Servidores */
  const paneServidores = `
    <div class="eq-list">${team.map(p=>`
      <div class="el-row">
        <span class="el-av">${iniciais(p.nome)}</span>
        <div class="el-info"><div class="el-nome">${p.nome}</div><div class="el-cargo">${p.cargo}</div></div>
        <button class="el-eye" onclick="abrirServidor('${e.inep}','${p.m}')" title="Ver detalhes" aria-label="Ver detalhes de ${p.nome}">${svgP('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',16)}</button>
      </div>`).join('')}</div>`;

  /* aba Turmas */
  const paneTurmas = turmas.length ? `<table class="pt-tbl"><thead><tr><th>Turma</th><th>Turno</th><th style="text-align:right;">Alunos</th></tr></thead><tbody>${turmas.map(t=>`<tr><td><b>${t.nome}</b></td><td class="muted">${t.turno}</td><td style="text-align:right;font-weight:600;">${t.alunos}</td></tr>`).join('')}</tbody></table>` : `<div class="p-empty">Nenhuma turma cadastrada</div>`;

  /* aba Alunos — lista de alunos */
  const alunos = alunosDaEscola(e);
  const teaN = alunos.filter(a=>a.tea).length;
  const alRows = alunos.map(a=>`<tr data-s="${(a.nome+' '+a.turma).toLowerCase()}" data-nivel="${a.nivel}" data-serie="${a.serie}" data-turno="${a.turno}" data-doc="${a.doc}" data-status="${a.status}" data-entur="${a.enturmado?'Enturmado':'Sem turma'}" data-cpf="${a.cpf?'Com CPF':'Sem CPF'}" data-resp="${a.resp?'Com responsável':'Sem responsável'}" data-ee="${a.tea?'Sim':'Não'}"><td><b>${a.nome}</b>${a.tea?' <span class="al-tea">Ed. Especial</span>':''}</td><td class="muted">${a.turma}</td><td>${a.turno}</td></tr>`).join('');
  const uniq = k => [...new Set(alunos.map(a=>a[k]))];
  const FFLT = [
    ['fnivel','Nível de ensino', uniq('nivel')],
    ['fserie','Série ou ano', [...new Set(alunos.map(a=>a.serie))]],
    ['fturno','Turno', uniq('turno')],
    ['fdoc','Documentação', ['Completa','Incompleta']],
    ['fstatus','Status', ['Ativo','Transferido','Evadido','Remanejado']],
    ['fentur','Enturmação', ['Enturmado','Sem turma']],
    ['fcpf','CPF', ['Com CPF','Sem CPF']],
    ['fresp','Responsável', ['Com responsável','Sem responsável']],
    ['fee','Educação Especial', ['Sim','Não']],
  ];
  const sldr = '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="9" cy="18" r="2" fill="currentColor"/>';
  const paneAlunos = `
    <div class="al-head" style="position:relative;">
      <div class="al-count"><b id="alVis">${fmt(alunos.length)}</b> alunos</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <label class="al-search">${svgP('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',15)}<input id="alBusca" type="text" placeholder="Buscar aluno ou turma" oninput="filtrarAlunos()" autocomplete="off" /></label>
        <button class="fflt-toggle" id="ffltToggle" onclick="toggleFichaFiltros()">${svgP(sldr,15)} Filtrar busca por <span class="fflt-count" id="ffltCount" hidden></span></button>
        <button class="fflt-redef" onclick="redefinirFichaFiltros()">Redefinir filtros</button>
      </div>
      <div class="fflt-panel" id="ffltPanel" hidden>
        <div class="fflt-head"><span class="fflt-title">${svgP(sldr,16)} Filtrar busca por</span><button class="fflt-x" onclick="toggleFichaFiltros()" aria-label="Fechar">${svgP('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',16)}</button></div>
        <div class="fflt-body">
          ${FFLT.map(f=>`<div class="fflt"><span class="fflt-lbl">${f[1]}</span><select id="${f[0]}" onchange="filtrarAlunos()"><option value="">Selecione uma opção</option>${f[2].map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}
        </div>
        <div class="fflt-foot"><button class="btn-fechar2" onclick="toggleFichaFiltros()">Fechar</button><button class="btn-redef3" onclick="redefinirFichaFiltros()">Redefinir</button></div>
      </div>
    </div>
    <table class="pt-tbl"><thead><tr><th>Aluno</th><th>Turma</th><th>Turno</th></tr></thead><tbody id="alunosTbody">${alRows}</tbody></table>`;

  /* aba Ocorrências */
  const paneOcor = ocs.length ? `<table class="pt-tbl"><thead><tr><th>Envolvido(a)</th><th>Turma</th><th>Tipo</th><th>Data</th></tr></thead><tbody>${ocs.map(o=>`<tr><td><b>${o.al}</b></td><td class="muted">${o.t}</td><td>${o.tipo}</td><td class="muted">${o.data}</td></tr>`).join('')}</tbody></table>` : `<div class="p-empty">Nenhuma ocorrência registrada</div>`;

  document.getElementById('sheet').innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div class="sheet-ic ${e.cmei?'cmei':''}">${svgP(ICON_ESC,24)}</div>
      <div><div class="sheet-name" id="sheetName">${e.nome}</div>
        <div class="sheet-subt">${e.bairro} · ${e.localidade} · ${e.modalidade} · INEP ${e.inep}</div></div>
      <select class="bim-sel" onchange="setBim(this.value)" aria-label="Bimestre">${BIMS.map(b=>`<option ${b===fichaBim?'selected':''}>${b}</option>`).join('')}</select>
      <button class="sheet-close" onclick="fecharFicha()" aria-label="Fechar" style="margin-left:10px;">${svgP('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',18)}</button>
    </div>
    <div class="sheet-tabs">
      <button class="sheet-tab active" onclick="fichaTab(this,'inicio')">Início</button>
      <button class="sheet-tab" onclick="fichaTab(this,'servidores')">Servidores</button>
      <button class="sheet-tab" onclick="fichaTab(this,'turmas')">Turmas</button>
      <button class="sheet-tab" onclick="fichaTab(this,'alunos')">Alunos</button>
      <button class="sheet-tab" onclick="fichaTab(this,'ocorrencias')">Ocorrências</button>
    </div>
    <div class="sheet-body">
      <div class="stabpane" data-pane="inicio">${paneInicio}</div>
      <div class="stabpane" data-pane="servidores" hidden>${paneServidores}</div>
      <div class="stabpane" data-pane="turmas" hidden>${paneTurmas}</div>
      <div class="stabpane" data-pane="alunos" hidden>${paneAlunos}</div>
      <div class="stabpane" data-pane="ocorrencias" hidden>${paneOcor}</div>
    </div>`;
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.addEventListener('keydown', escHandler);
  // restaura a aba ativa (ex.: ao trocar o bimestre, mantém a aba em que estava)
  if(fichaTabAtual && fichaTabAtual!=='inicio'){
    const b = [...document.querySelectorAll('#sheet .sheet-tab')].find(x=>(x.getAttribute('onclick')||'').includes("'"+fichaTabAtual+"'"));
    if(b) fichaTab(b, fichaTabAtual);
  }
}
const SIT_LBL = { exercicio:'Ativo', licenca:'Licença', afastado:'Afastado', cedido:'Cedido' };
function seedFrom(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function gerarCPF(m){ let x=seedFrom('cpf'+m); const dig=()=>{ x=(x*1103515245+12345)>>>0; return Math.floor((x/65536)%10); }; const n=Array.from({length:11},dig); return `${n.slice(0,3).join('')}.${n.slice(3,6).join('')}.${n.slice(6,9).join('')}-${n.slice(9).join('')}`; }
function gerarNasc(m){ const x=seedFrom('nasc'+m); const d=1+x%28, mo=1+Math.floor(x/28)%12, y=1975+Math.floor(x/400)%25; const p2=v=>String(v).padStart(2,'0'); return `${p2(d)}/${p2(mo)}/${y}`; }
function emailDe(nome){ return nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'')+'@eprof.app'; }
function contatoDe(m){ const d=m.slice(-4); return `(73) 9 ${d}-${String(4000+(parseInt(d)%5000)).padStart(4,'0')}`; }

const _ini = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const AUDIT = `${svgP('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',13)} Este painel não exibe avaliação de desempenho, saúde, processo administrativo ou dados bancários (política da rede). Acesso registrado em auditoria.`;
function abrirPainelServidor(narrow, s, esc, bodyHtml){
  const sp = document.getElementById('sp2');
  sp.classList.toggle('narrow', !!narrow);
  sp.innerHTML = `
    <div class="sp2-head">
      <div class="sp2-av">${_ini(s.nome)}</div>
      <div><div class="sp2-name">${s.nome}</div><div class="sp2-sub">${s.cargo} · ${esc}</div></div>
      <button class="sp2-close" onclick="fecharServidor()" aria-label="Fechar">${svgP('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',17)}</button>
    </div>
    <div class="sp2-body">${bodyHtml}</div>
    <div class="sp2-foot">${AUDIT}</div>`;
  document.getElementById('sp2Overlay').classList.add('open');
  sp.classList.add('open');
  document.addEventListener('keydown', escHandler);
}

function abrirServidor(inep, m){
  const s = (window.gerarEquipe ? gerarEquipe(inep) : []).find(x=>x.m===m); if(!s) return;
  if(s.grupo==='Professores') abrirProfessor(inep, m); else abrirUsuario(inep, m);
}

function abrirUsuario(inep, m){
  const s = (window.gerarEquipe ? gerarEquipe(inep) : []).find(x=>x.m===m); if(!s) return;
  const esc = REDE_NOME[inep] || '';
  const ativo = s.situacao==='exercicio';
  const statusStyle = ativo ? 'background:var(--verde-bg);color:#2E8B00;border:1px solid #BCE6A8;' : 'background:#FDF3D9;color:var(--ambar-escuro);border:1px solid #F0DDA8;';
  const body = `
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <span class="pchip azul">${s.cargo}</span>
      <span class="pchip" style="${statusStyle}">${SIT_LBL[s.situacao]}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="fld"><div class="fl">CPF</div><div class="fv">${gerarCPF(s.m)}</div></div>
      <div class="fld"><div class="fl">Data de nascimento</div><div class="fv">${gerarNasc(s.m)}</div></div>
      <div class="fld"><div class="fl">E-mail</div><div class="fv">${emailDe(s.nome)}</div></div>
      <div class="fld"><div class="fl">Contato</div><div class="fv">${contatoDe(s.m)}</div></div>
    </div>`;
  abrirPainelServidor(true, s, esc, body);
}

function abrirProfessor(inep, m){
  const s = (window.gerarEquipe ? gerarEquipe(inep) : []).find(x=>x.m===m); if(!s) return;
  const esc = REDE_NOME[inep] || '';
  const nunca = s.acesso==='nunca';
  const etapa = s.etapas[0] || '—';
  const discChips = s.disc.length ? s.disc.map(d=>`<span class="pchip laranja">${d}</span>`).join(' ') : '<span class="muted" style="font-size:12.5px;">Sem disciplina vinculada</span>';
  const linkIc = '<path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>';
  const turmasHtml = s.turmas.length
    ? `<table class="pt-tbl"><thead><tr><th>Turma</th><th>Nível</th><th>Turno</th></tr></thead><tbody>${s.turmas.map(t=>`<tr><td><b>${t.t}</b></td><td class="muted">${t.n}</td><td>${t.turno}</td></tr>`).join('')}</tbody></table>`
    : `<div class="p-empty">Nenhuma turma vinculada</div>`;
  const ocorHtml = s.ocor.length
    ? `<table class="pt-tbl"><thead><tr><th>Turma</th><th>Tipo</th><th>Data</th></tr></thead><tbody>${s.ocor.map(o=>`<tr><td>${o.t}</td><td>${o.tipo}</td><td class="muted">${o.data}</td></tr>`).join('')}</tbody></table>`
    : `<div class="p-empty">Nenhum registro encontrado</div>`;
  const vincHtml = s.lotacoes.map(l=>`<div class="p-vinc"><span class="vic">${svgP(linkIc,16)}</span><span class="vn">${l.escola}</span><span class="vc">${l.cargos.join(' · ')}</span></div>`).join('');
  const body = `
    <div class="two">
      <div class="card">
        <div style="font-size:12.5px;color:var(--texto-suave);margin-bottom:14px;">${nunca?'Nunca acessou a plataforma':'Último acesso em '+s.acesso}</div>
        <div class="p-lbl">Atua em</div><span class="pchip azul">${etapa}</span>
        <div class="p-lbl" style="margin-top:16px;">Disciplinas</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${discChips}</div>
      </div>
      <div class="card"><div class="card-t">Quadro de turmas</div>${turmasHtml}</div>
    </div>
    <div class="two">
      <div class="card"><div class="card-t">Registro de ocorrências</div>${ocorHtml}</div>
      <div class="card"><div class="card-t">Vínculos</div>${vincHtml}</div>
    </div>`;
  abrirPainelServidor(false, s, esc, body);
}

function fecharServidor(){
  document.getElementById('sp2').classList.remove('open');
  document.getElementById('sp2Overlay').classList.remove('open');
}
function escHandler(ev){
  if(ev.key!=='Escape') return;
  if(document.getElementById('sp2').classList.contains('open')) fecharServidor();
  else fecharFicha();
}
function fecharFicha(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
  document.removeEventListener('keydown', escHandler);
  // embutida em iframe (modo bare): avisa a tela-pai para fechar a sobreposição
  if(document.body.classList.contains('bare')){ try{ parent.postMessage('eprof:fechar-ficha','*'); }catch(e){} }
}
// Abre a ficha automaticamente quando chamada por outra tela (ex.: olho em Escolas → inicio2.html?escola=INEP&bare=1)
(function(){ try {
  const qs = new URLSearchParams(location.search);
  if(qs.get('bare')==='1'){ document.documentElement.classList.add('bare'); document.body.classList.add('bare'); }
  const inep = qs.get('escola'); if(inep) abrirFicha(inep);
} catch(e){} })();
</script>
